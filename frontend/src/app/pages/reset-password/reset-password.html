<div class="auth-container card">
  <h2>Reset Password</h2>

  <div *ngIf="errorMessage" class="error-msg">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="submit()" *ngIf="!errorMessage">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="newPassword" [(ngModel)]="newPassword" required minlength="6">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6">
      <small *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" style="color: red;">
        Passwords do not match
      </small>
    </div>

    <button type="submit" class="btn-primary" [disabled]="!newPassword || newPassword !== confirmPassword || isLoading">
      {{ isLoading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>

  <div class="footer-links" *ngIf="errorMessage">
    <a routerLink="/forgot-password">Request a new reset link</a>
  </div>
</div>
