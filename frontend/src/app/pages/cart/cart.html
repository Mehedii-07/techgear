<div class="cart-container">
  <h2>Your Shopping Cart</h2>

  <div *ngIf="cart.items().length > 0; else emptyCart" class="cart-content">
    <div class="cart-items card">
      <div class="cart-item" *ngFor="let item of cart.items()">
        <img [src]="item.product.image_url || 'assets/placeholder.png'" alt="Product Image" class="item-img">
        <div class="item-info">
          <h4>{{ item.product.name }}</h4>
          <div class="price">${{ item.product.price }}</div>
        </div>
        <div class="item-actions">
          <input type="number" [value]="item.quantity" min="1" (change)="updateQuantity(item.product.id, $event)">
          <button class="btn-remove" (click)="removeItem(item.product.id)">Remove</button>
        </div>
        <div class="item-total">
          ${{ (item.product.price * item.quantity).toFixed(2) }}
        </div>
      </div>
    </div>

    <div class="cart-summary card">
      <h3>Summary</h3>
      <div class="summary-row">
        <span>Items:</span>
        <span>{{ cart.totalItems() }}</span>
      </div>
      <div class="summary-row total">
        <span>Total:</span>
        <span>${{ cart.totalPrice().toFixed(2) }}</span>
      </div>
      <a routerLink="/checkout" class="btn-primary w-100 mt-1">Proceed to Checkout</a>
    </div>
  </div>

  <ng-template #emptyCart>
    <div class="empty-state card">
      <p>Your cart is empty.</p>
      <a routerLink="/" class="btn-primary mt-1">Continue Shopping</a>
    </div>
  </ng-template>
</div>
