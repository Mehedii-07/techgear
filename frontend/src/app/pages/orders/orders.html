<div class="orders-container">
  <h2>My Orders</h2>

  <div *ngIf="orders().length === 0" class="empty-state card">
    <p>You have not placed any orders yet.</p>
  </div>

  <div class="order-list">
    <div class="card order-card" *ngFor="let order of orders()">
      <div class="order-header">
        <div class="info">
          <strong>Order #{{ order.id }}</strong>
          <span class="date">{{ order.created_at | date:'medium' }}</span>
        </div>
        <div class="status-badge" [ngClass]="order.status">{{ order.status | titlecase }}</div>
      </div>
      
      <div class="order-items">
        <div class="item" *ngFor="let item of order.items">
          Product ID: {{ item.product_id }} (Qty: {{ item.quantity }})
        </div>
      </div>
      
      <div class="mt-1" style="color: #2e7d32; font-size: 0.9rem; font-weight: 500;" *ngIf="order.status !== 'delivered'">
        Estimated Delivery: 3-4 days
      </div>
    </div>
  </div>
</div>
