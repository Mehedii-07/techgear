<div class="auth-container card">
  <h2>Forgot Password</h2>
  
  <div *ngIf="successMessage" class="success-msg">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="submit()" *ngIf="!successMessage">
    <p style="text-align: center; color: var(--text-sub); margin-bottom: 1.5rem;">
      Enter your email address and we will send you a link to reset your password.
    </p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" [(ngModel)]="email" required placeholder="john@example.com">
    </div>

    <button type="submit" class="btn-primary" [disabled]="!email || isLoading">
      {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>

  <div class="footer-links">
    <a routerLink="/login">Back to Login</a>
  </div>
</div>
