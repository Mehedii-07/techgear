<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="brand">TechGear</a>
    
    <div class="search-bar">
      <input type="text" placeholder="Search in TechGear..." [(ngModel)]="searchQuery" (ngModelChange)="onSearchInput()">
      <button class="search-btn" (click)="search()">Search</button>
    </div>

    <div class="nav-actions">
      <a routerLink="/cart" class="nav-item cart">
        Cart <span class="badge" *ngIf="cart.totalItems() > 0">{{ cart.totalItems() }}</span>
      </a>
      
      <ng-container *ngIf="auth.isAuthenticated(); else loginLink">
        
        <div *ngIf="auth.isAdmin()" class="nav-item dropdown">
          <a routerLink="/admin" class="nav-link">Admin ▾</a>
          <div class="dropdown-menu">
            <a routerLink="/admin" [queryParams]="{tab: 'analytics'}">Analytics</a>
            <a routerLink="/admin" [queryParams]="{tab: 'orders'}">Orders & Refunds</a>
            <a routerLink="/admin" [queryParams]="{tab: 'products'}">Products</a>
            <a routerLink="/admin" [queryParams]="{tab: 'users'}">Users</a>
          </div>
        </div>

        <div class="nav-item dropdown">
          <a routerLink="/account" class="nav-link">My Account ▾</a>
          <div class="dropdown-menu">
            <a routerLink="/account" [queryParams]="{tab: 'profile'}">Profile</a>
            <a routerLink="/account" [queryParams]="{tab: 'orders'}">My Orders</a>
          </div>
        </div>

        <button class="btn-secondary logout-btn" (click)="logout()">Logout</button>
      </ng-container>
      <ng-template #loginLink>
        <a routerLink="/login" class="nav-item login-link">Login / Signup</a>
      </ng-template>
    </div>
  </div>
</nav>
